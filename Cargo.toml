[package]
name = "pointman-extension"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The extension side of the Pointman node's extension protocol, and a stand-in node for tests"
repository = "https://github.com/pointman-ai/pointman-extension"
readme = "README.md"
keywords = ["pointman", "extension", "json-rpc"]

[lib]
name = "pointman_extension"

[dependencies]
anyhow = "1"
serde = "1"
serde_json = "1"
toml = "1"

[[example]]
name = "hello"
path = "examples/hello/main.rs"

[[example]]
name = "demo"
path = "examples/demo/main.rs"

[[example]]
name = "panes"
path = "examples/panes/main.rs"
