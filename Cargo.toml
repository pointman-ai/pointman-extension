[package]
name = "pointman-extension"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "The extension side of the Pointman node's extension protocol, and a stand-in node for tests"
repository = "https://github.com/pointman-ai/pointman-extension"
readme = "README.md"
keywords = ["pointman", "extension", "json-rpc"]

[lib]
name = "pointman_extension"

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
buffa-descriptor = { version = "0.9.2", features = ["json", "reflect"] }
buffa-types = { version = "0.9.2", features = ["json", "reflect"] }
anyhow = "1"
serde = "1"
serde_json = "1"
toml = "1"
# the `proto` feature: an extension's own proto (proto/<id>/v1/<id>.proto) made into its manifest's schemas and Rust types
protox = { version = "0.10", optional = true }
toml_edit = { version = "0.25", optional = true }
buffa-build = { version = "0.9.2", optional = true }

[features]
proto = ["dep:protox", "dep:toml_edit", "dep:buffa-build"]

[[bin]]
name = "pointman-extension"
path = "src/bin/pointman-extension.rs"
required-features = ["proto"]

[[example]]
name = "hello"
path = "examples/hello/main.rs"

[[example]]
name = "demo"
path = "examples/demo/main.rs"

[[example]]
name = "panes"
path = "examples/panes/main.rs"

[[example]]
name = "trim_descriptors"
path = "examples/trim_descriptors.rs"

[build-dependencies]
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-descriptor = "0.9.2"

[[example]]
name = "video"
path = "examples/video/main.rs"
